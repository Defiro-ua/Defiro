spring.application.name=defiro

spring.datasource.url=jdbc:postgresql://localhost:5432/defiro
spring.datasource.username=defiro
spring.datasource.password=defiro
# One schema per store (architecture §4): Designer, Engine and Registry store. Identity owns no data.
spring.flyway.schemas=designer,engine,registry
spring.flyway.default-schema=public

# Only packages annotated with @ApplicationModule are modules. Without this,
# the spec and plugin-sdk packages (io.github.defiro.spec, .plugin) count too.
spring.modulith.detection-strategy=explicitly-annotated
