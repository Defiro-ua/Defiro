# Cucumber, run by acceptance/CucumberIT.
cucumber.glue=io.github.defiro.acceptance
# @wip is work in progress and @browser runs in the browser journeys (Playwright), not here.
# To run other scenarios locally: ./mvnw verify -DskipUTs -Dcucumber.filter.tags="@UC03"
cucumber.filter.tags=not @wip and not @browser
cucumber.plugin=pretty, json:target/cucumber/cucumber.json, html:target/cucumber/report.html
cucumber.publish.quiet=true
