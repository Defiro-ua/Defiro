version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # Version updates wait 7 days after a release, so a compromised release is usually
    # caught and pulled before it reaches us. Security updates are never delayed.
    cooldown:
      default-days: 7
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The web app's Dockerfile. A new Node major changes .nvmrc, the Dockerfile and CI together,
  # so it is done by hand.
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
