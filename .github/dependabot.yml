version: 2

# Version updates go to develop, the integration branch, like any feature: they reach main with the
# next release. Dependabot reads this file only from main, so changes to it must be merged there.
# Security updates ignore target-branch and always go to main; merge main back into develop after
# each one, as with a hotfix.
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Version updates wait 7 days after a release, so a compromised release is usually
    # caught and pulled before it reaches us. Security updates are never delayed.
    cooldown:
      default-days: 7
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The web app's Dockerfile. A new Node major changes .nvmrc, the Dockerfile and CI together,
  # so it is done by hand.
  - package-ecosystem: docker
    directory: /apps/web
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
