services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: defiro
      POSTGRES_USER: defiro
      POSTGRES_PASSWORD: defiro
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # The web app, built and served by nginx. Port 3000, so it doesn't clash with the server on 8080.
  web:
    build: ../apps/web
    image: defiro-web
    ports: ["${WEB_PORT:-3000}:80"]
    restart: unless-stopped
    environment:
      DEFIRO_SERVER: ${DEFIRO_SERVER:-http://host.docker.internal:8080}
    # The server runs on the host (./mvnw spring-boot:run); on Linux this name needs to be added
    extra_hosts: ["host.docker.internal:host-gateway"]

  # The web app with live reload, without installing Node: docker compose -f deploy/compose.yaml --profile dev up web-dev
  web-dev:
    profiles: [dev]
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports: ["${WEB_DEV_PORT:-5173}:5173"]
    volumes:
      - ../apps/web:/app
      # node_modules stays in the container, apart from the host's
      - web-node-modules:/app/node_modules
    environment:
      # Mounted folders on Windows and macOS need polling for Vite to notice changes
      CHOKIDAR_USEPOLLING: "true"
      # The server, on the host
      DEFIRO_SERVER: ${DEFIRO_SERVER:-http://host.docker.internal:8080}
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  pgdata:
  web-node-modules:
